<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mô hình cơ bản</title>
<style>
  html,body{margin:0;background:#E9E9EC;font-family:Arial,'Segoe UI',sans-serif}
  .wrap{width:min(1280px,100vw);margin:16px auto;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.18)}
  svg{display:block;width:100%;height:auto}
  .m{font-family:'Times New Roman',serif;font-style:italic}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Segoe UI', sans-serif" fill="#1d1d1f">
  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C99A06"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FD1"/></marker>
    <marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
    <!-- learnable prompt: 4 context vectors -->
    <g id="pg">
      <rect x="0" y="0" width="13" height="18" rx="2" fill="#F6C343" stroke="#9A7B10"/>
      <rect x="14" y="0" width="13" height="18" rx="2" fill="#F6C343" stroke="#9A7B10"/>
      <rect x="28" y="0" width="13" height="18" rx="2" fill="#F6C343" stroke="#9A7B10"/>
      <rect x="42" y="0" width="13" height="18" rx="2" fill="#F6C343" stroke="#9A7B10"/>
    </g>
    <g id="imgs">
      <rect x="0" y="0" width="18" height="16" fill="#C9A27E" stroke="#fff"/>
      <rect x="10" y="4" width="18" height="16" fill="#8FB3D9" stroke="#fff"/>
      <rect x="20" y="8" width="18" height="16" fill="#A6C48A" stroke="#fff"/>
    </g>
  </defs>
  <rect width="1280" height="720" fill="#fff"/>

  <text x="28" y="40" font-size="24" font-weight="700">Mô hình cơ bản: Federated Prompt Learning với CLIP (CoOp)</text>
  <text x="28" y="64" font-size="14" fill="#555">Mỗi vòng: server gửi prompt chung → mỗi client học prompt trên ảnh của mình → gửi lại → server lấy trung bình. Lặp 50 vòng.</text>

  <!-- ================= LEFT: server and clients ================= -->
  <!-- server -->
  <g transform="translate(40,150)">
    <path d="M18,52 a26,26 0 0 1 8,-50 a34,34 0 0 1 62,6 a22,22 0 0 1 4,44 z" fill="#E4EEFB" stroke="#5B87C0" stroke-width="2"/>
    <rect x="34" y="18" width="40" height="8" rx="2" fill="#5B87C0"/><rect x="34" y="29" width="40" height="8" rx="2" fill="#5B87C0"/>
    <text x="54" y="74" font-size="15" font-weight="700" text-anchor="middle">Server</text>
  </g>
  <!-- step 1 box -->
  <rect x="24" y="250" width="176" height="104" rx="8" fill="#FFF7DC" stroke="#C99A06"/>
  <circle cx="42" cy="268" r="11" fill="#C99A06"/><text x="42" y="272.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="58" y="273" font-size="13" font-weight="700">Khởi tạo</text>
  <use href="#pg" x="40" y="284"/>
  <text x="102" y="298" font-size="13" class="m" font-size="15">p</text><text x="110" y="301" font-size="10" class="m">G</text>
  <text x="34" y="322" font-size="11.5">prompt chung: 4 × 512 số</text>
  <text x="34" y="338" font-size="11.5" fill="#666">ngẫu nhiên (độ lệch 0,02)</text>
  <!-- step 4 box -->
  <rect x="24" y="372" width="176" height="104" rx="8" fill="#EAF1FC" stroke="#2F6FD1"/>
  <circle cx="42" cy="390" r="11" fill="#2F6FD1"/><text x="42" y="394.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="58" y="395" font-size="13" font-weight="700">Gộp (FedAvg)</text>
  <text x="34" y="418" font-size="11.5"><tspan class="m" font-size="14">p</tspan><tspan class="m" font-size="10" dy="3">G</tspan><tspan dy="-3"> ← trung bình các</tspan></text>
  <text x="34" y="434" font-size="11.5"><tspan class="m" font-size="14">p</tspan><tspan class="m" font-size="10" dy="3">G,i</tspan><tspan dy="-3"> client gửi về</tspan></text>
  <text x="34" y="452" font-size="11" fill="#666">(trọng số theo số ảnh)</text>
  <text x="34" y="467" font-size="11" fill="#666">→ quay lại bước 1 ở vòng sau</text>

  <!-- clients -->
  <g font-size="13">
    <rect x="262" y="120" width="128" height="74" rx="8" fill="#fff" stroke="#7FA86A" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="326" y="112" text-anchor="middle" font-weight="700">Client 1</text>
    <use href="#pg" x="272" y="132"/><use href="#imgs" x="340" y="130"/>
    <text x="272" y="180" font-size="11" fill="#555">ảnh không rời máy</text>

    <rect x="262" y="270" width="128" height="74" rx="8" fill="#FFF3E8" stroke="#E8741A" stroke-width="2.2" stroke-dasharray="5 3"/>
    <text x="326" y="262" text-anchor="middle" font-weight="700">Client <tspan class="m">i</tspan></text>
    <use href="#pg" x="272" y="282"/><use href="#imgs" x="340" y="280"/>
    <text x="272" y="330" font-size="11" fill="#555">ảnh không rời máy</text>

    <text x="326" y="384" text-anchor="middle" font-size="20" fill="#888">⋮</text>
    <rect x="262" y="420" width="128" height="74" rx="8" fill="#fff" stroke="#C0607A" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="326" y="412" text-anchor="middle" font-weight="700">Client <tspan class="m">N</tspan></text>
    <use href="#pg" x="272" y="432"/><use href="#imgs" x="340" y="430"/>
    <text x="272" y="480" font-size="11" fill="#555">ảnh không rời máy</text>
  </g>
  <!-- down (gold) / up (blue) -->
  <g stroke-width="2.2" fill="none">
    <path d="M148,206 C200,190 220,160 258,150" stroke="#C99A06" marker-end="url(#aG)"/>
    <path d="M148,214 C200,240 220,280 258,296" stroke="#C99A06" marker-end="url(#aG)"/>
    <path d="M148,222 C200,300 220,420 258,446" stroke="#C99A06" marker-end="url(#aG)"/>
    <path d="M262,172 C230,196 214,226 206,380" stroke="#2F6FD1" stroke-dasharray="6 4" marker-end="url(#aB)"/>
    <path d="M262,318 C240,330 224,350 208,384" stroke="#2F6FD1" stroke-dasharray="6 4" marker-end="url(#aB)"/>
    <path d="M262,470 C240,462 226,450 208,440" stroke="#2F6FD1" stroke-dasharray="6 4" marker-end="url(#aB)"/>
  </g>
  <text x="196" y="132" font-size="11.5" fill="#9A7B10" font-weight="700">gửi p<tspan font-size="9" dy="2">G</tspan></text>
  <text x="200" y="520" font-size="11.5" fill="#2F6FD1" font-weight="700">3  gửi lại p<tspan font-size="9" dy="2">G,i</tspan><tspan dy="-2"> (chỉ 2.048 số)</tspan></text>

  <!-- zoom arrow -->
  <path d="M398,300 L436,300 L436,288 L458,307 L436,326 L436,314 L398,314 z" fill="#F6B98A"/>

  <!-- ================= RIGHT: inside client i ================= -->
  <rect x="464" y="84" width="796" height="472" rx="16" fill="#FFFCF8" stroke="#E8741A" stroke-width="2" stroke-dasharray="8 5"/>
  <circle cx="488" cy="108" r="12" fill="#E8741A"/><text x="488" y="113" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="508" y="114" font-size="16" font-weight="700">Bên trong client <tspan class="m">i</tspan>: học prompt trên ảnh của mình (1 lượt)</text>

  <!-- prompts -->
  <text x="500" y="154" font-size="13" font-weight="700">Prompt cho từng lớp</text>
  <g font-size="12.5">
    <use href="#pg" x="484" y="162"/><rect x="544" y="162" width="70" height="18" rx="3" fill="#E1EAF5" stroke="#6C8FC0"/><text x="579" y="175" text-anchor="middle">Pug</text>
    <use href="#pg" x="484" y="188"/><rect x="544" y="188" width="70" height="18" rx="3" fill="#E1EAF5" stroke="#6C8FC0"/><text x="579" y="201" text-anchor="middle">Beagle</text>
    <text x="512" y="222" fill="#888">⋮</text>
    <use href="#pg" x="484" y="230"/><rect x="544" y="230" width="70" height="18" rx="3" fill="#E1EAF5" stroke="#6C8FC0"/><text x="579" y="243" text-anchor="middle">Bombay</text>
  </g>
  <text x="484" y="270" font-size="11.5">🔥 4 ô vàng: học được (dùng chung mọi lớp)</text>
  <text x="484" y="286" font-size="11.5">❄ tên lớp: cố định</text>
  <!-- text encoder -->
  <line x1="620" y1="205" x2="652" y2="205" stroke="#555" stroke-width="1.6" marker-end="url(#aK)"/>
  <path d="M656,150 L756,172 L756,240 L656,262 z" fill="#DCE6F4" stroke="#4F6FA8" stroke-width="1.6"/>
  <text x="704" y="200" font-size="13" font-weight="700" text-anchor="middle">Bộ đọc chữ</text>
  <text x="704" y="216" font-size="11" text-anchor="middle">của CLIP ❄</text>
  <line x1="758" y1="205" x2="790" y2="205" stroke="#555" stroke-width="1.6" marker-end="url(#aK)"/>
  <!-- text features -->
  <g>
    <rect x="796" y="160" width="12" height="44" fill="#E9C46A"/><rect x="810" y="160" width="12" height="44" fill="#90BE6D"/>
    <rect x="824" y="160" width="12" height="44" fill="#577590"/><rect x="838" y="160" width="12" height="44" fill="#E76F51"/>
  </g>
  <text x="796" y="222" font-size="11.5">đặc trưng chữ</text>
  <text x="796" y="237" font-size="11.5">của mỗi lớp</text>

  <!-- image path -->
  <text x="484" y="338" font-size="13" font-weight="700">Ảnh của client (có nhãn)</text>
  <rect x="484" y="350" width="96" height="78" rx="6" fill="#F3EBDD" stroke="#B49B74"/>
  <circle cx="532" cy="386" r="22" fill="#D9B58C"/><circle cx="523" cy="381" r="3" fill="#333"/><circle cx="541" cy="381" r="3" fill="#333"/>
  <ellipse cx="532" cy="394" rx="8" ry="5" fill="#8C6A4A"/>
  <text x="532" y="446" font-size="12" text-anchor="middle">nhãn: <tspan font-weight="700">Pug</tspan></text>
  <line x1="584" y1="389" x2="652" y2="389" stroke="#555" stroke-width="1.6" marker-end="url(#aK)"/>
  <path d="M656,334 L756,356 L756,422 L656,444 z" fill="#C9D6EE" stroke="#4F6FA8" stroke-width="1.6"/>
  <text x="704" y="384" font-size="13" font-weight="700" text-anchor="middle">Bộ đọc ảnh</text>
  <text x="704" y="400" font-size="11" text-anchor="middle">của CLIP ❄</text>
  <text x="704" y="414" font-size="10.5" text-anchor="middle" fill="#555">(ResNet-50)</text>
  <line x1="758" y1="389" x2="790" y2="389" stroke="#555" stroke-width="1.6" marker-end="url(#aK)"/>
  <rect x="796" y="366" width="14" height="44" fill="#8E9CB8"/>
  <text x="796" y="428" font-size="11.5">đặc trưng ảnh</text>

  <!-- compare -->
  <line x1="852" y1="182" x2="900" y2="270" stroke="#555" stroke-width="1.6" marker-end="url(#aK)"/>
  <line x1="814" y1="388" x2="900" y2="300" stroke="#555" stroke-width="1.6" marker-end="url(#aK)"/>
  <circle cx="916" cy="285" r="18" fill="#fff" stroke="#555" stroke-width="1.6"/>
  <text x="916" y="291" font-size="17" text-anchor="middle">⊗</text>
  <text x="872" y="322" font-size="11.5">so độ giống</text>
  <text x="872" y="337" font-size="11.5">ảnh ↔ từng lớp</text>
  <line x1="936" y1="285" x2="968" y2="285" stroke="#555" stroke-width="1.6" marker-end="url(#aK)"/>
  <!-- probabilities -->
  <rect x="972" y="226" width="150" height="118" rx="8" fill="#fff" stroke="#BBB"/>
  <text x="984" y="246" font-size="12" font-weight="700">Mô hình đoán</text>
  <g font-size="11.5">
    <text x="984" y="268">Pug</text><rect x="1040" y="258" width="62" height="12" fill="#577590"/>
    <text x="984" y="290">Beagle</text><rect x="1040" y="280" width="26" height="12" fill="#9DB0C4"/>
    <text x="984" y="312">Bombay</text><rect x="1040" y="302" width="10" height="12" fill="#9DB0C4"/>
    <text x="984" y="334" fill="#888">…</text>
  </g>
  <line x1="1124" y1="285" x2="1150" y2="285" stroke="#555" stroke-width="1.6" marker-end="url(#aK)"/>
  <rect x="1154" y="258" width="90" height="56" rx="8" fill="#FBE3E0" stroke="#C0392B"/>
  <text x="1199" y="281" font-size="12.5" font-weight="700" text-anchor="middle">Sai số</text>
  <text x="1199" y="299" font-size="11" text-anchor="middle">so với nhãn</text>
  <!-- backprop -->
  <path d="M1199,256 L1199,140 Q1199,126 1185,126 L500,126 C482,126 474,140 476,160" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#aR)"/>
  <text x="1186" y="146" font-size="12.5" fill="#C0392B" font-weight="700" text-anchor="end">lan truyền ngược: CHỈ chỉnh 4 ô vàng 🔥, CLIP giữ nguyên ❄</text>

  <!-- local summary -->
  <rect x="484" y="470" width="756" height="70" rx="8" fill="#F7F7F9" stroke="#D5D8DE"/>
  <text x="500" y="493" font-size="13"><tspan font-weight="700">Kết quả:</tspan> làm như trên cho mọi ảnh của client (1 lượt), được prompt mới <tspan class="m" font-size="15">p</tspan><tspan class="m" font-size="11" dy="3">G,i</tspan><tspan dy="-3">.</tspan></text>
  <text x="500" y="514" font-size="13">Client chỉ gửi lại prompt mới này (2.048 số). Ảnh, nhãn và CLIP đều ở lại máy.</text>
  <text x="500" y="532" font-size="12" fill="#666">CLIP (≈ 100 triệu số) đã huấn luyện sẵn, có sẵn trên mọi máy, không bao giờ được gửi đi.</text>

  <!-- ================= BOTTOM: why a learnable prompt ================= -->
  <rect x="24" y="574" width="1236" height="86" rx="10" fill="#FBF6EC" stroke="#E3D3B4"/>
  <text x="44" y="600" font-size="14" font-weight="700">Vì sao học prompt thay vì viết tay?</text>
  <text x="44" y="626" font-size="13">CLIP gốc dùng câu viết tay:</text>
  <rect x="226" y="610" width="168" height="24" rx="4" fill="#fff" stroke="#AAA"/>
  <text x="310" y="627" font-size="13" text-anchor="middle">"a photo of a" + Pug</text>
  <text x="44" y="650" font-size="12" fill="#666">cùng một câu cho mọi bộ dữ liệu, không thích nghi với dữ liệu của mình</text>
  <text x="660" y="626" font-size="13">Ở đây (CoOp):</text>
  <use href="#pg" x="752" y="611"/>
  <text x="814" y="626" font-size="13">+ Pug</text>
  <text x="862" y="626" font-size="13">— 4 "từ" do mô hình tự học từ dữ liệu của các client</text>
  <text x="660" y="650" font-size="12" fill="#666">cùng một bộ não CLIP, chỉ đổi "câu hỏi" cho hợp hơn, nên gửi qua mạng rất ít</text>

  <!-- legend -->
  <g font-size="12">
    <text x="28" y="696">🔥 học được</text>
    <text x="128" y="696">❄ đóng băng</text>
    <line x1="232" y1="692" x2="268" y2="692" stroke="#C99A06" stroke-width="2.2" marker-end="url(#aG)"/><text x="274" y="696">server → client</text>
    <line x1="392" y1="692" x2="428" y2="692" stroke="#2F6FD1" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#aB)"/><text x="434" y="696">client → server</text>
    <use href="#pg" x="552" y="683" transform="translate(552,683) scale(.75) translate(-552,-683)"/><text x="600" y="696"><tspan class="m" font-size="14">p</tspan><tspan class="m" font-size="10" dy="3">G</tspan><tspan dy="-3">: prompt chung 4 × 512</tspan></text>
  </g>
</svg>
</div>
</body>
</html>
